<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/style.css">
  <title>Вход - Газпромбанк Бизнес-Онлайн</title>
</head>

<body>
  <header class="container">
    <div class="header">
      <div class="header__logo">
        <a class="header__logo-link" href="#">
          <img class="header__logo-img" src="images/logo-head.png" width="202" height="50" alt="Газпромбанк">
        </a>
      </div>
  
      <div class="header__award">
        <div class="header__award-text">
          <span class="header__award-text">Топ-3 лучших банков для корпоративных клиентов</span>
          <span class="header__award-text-sub">По версии Markswebb</span>
        </div>
        <div class="header__award-icon">
          <svg class="header__award-icon-svg" width="24" height="24" aria-hidden="true">
            <use xlink:href="images/sprite.svg#icon-reward"></use>
          </svg>
        </div>
      </div>
    </div>
  </header>

  <main class="container login-page">

    <div class="login-card">
      <div class="login-card__inner">
        <h1 class="login-card__title">Вход в ГПБ Бизнес-онлайн</h1>

        <form class="login" action="#" method="POST">
          <!-- Логин -->

          <div class="field">
            <div class="field__wrapper">
              <label for="login" class="field__label">Логин</label>
              <input class="field__input" type="text" id="login" name="login" autocomplete="username" required>
              <svg class="field__icon" width="24" height="24" aria-hidden="true">
                <use xlink:href="images/sprite.svg#account-icon"></use>
              </svg>
            </div>
          </div>


          <!-- Пароль -->

          <div class="field">
            <div class="field__wrapper">
              <label for="password" class="field__label">Пароль</label>
              <input class="field__input" type="password" id="password" name="password" autocomplete="current-password" required>
              <svg class="field__icon" width="24" height="24" aria-hidden="true">
                <use xlink:href="images/sprite.svg#eye-closed-icon"></use>
              </svg>
            </div>
          </div>


          <button class="btn btn--primary" type="submit">Войти</button>
          <a class="login__link login__link--forgot" href="#">Забыли логин или пароль?</a>
        </form>
      </div>

      <!-- Блок ЭТП внутри той же карточки -->
      <div class="login-card__etp">
        <span class="login-card__etp-text">Войти с помощью:</span>
        <a href="#" class="login-card__etp-link">
          <svg class="login-card__etp-icon" width="20" height="20" aria-hidden="true">
            <use xlink:href="images/sprite.svg#etp-icon"></use>
          </svg>
          <span class="login-card__etp-text">ЭТП ГПБ</span>
        </a>
      </div>

    </div>
    <a class="login-page__register-link" href="#">Зарегистрироваться</a>
  </main>

  <footer class="container">
    <div class="footer">
      <div class="footer__left">
        <div class="footer__contacts">
          <a class="footer__contact-link" href="tel:88001001189">
            <svg class="footer__icon" width="20" height="20" aria-hidden="true">
              <use xlink:href="images/sprite.svg#phone-icon"></use>
            </svg>
            <span>8 800 100 11 89</span>
          </a>
  
          <a class="footer__contact-link" href="#">
            <svg class="footer__icon" width="20" height="20" aria-hidden="true">
              <use xlink:href="images/sprite.svg#tlg-icon"></use>
            </svg>
            <span>Написать в Telegram</span>
          </a>
        </div>
  
        <div class="footer__legal">
          <span class="footer__copyright">&copy;&nbsp;2024 Банк ГПБ (АО) Генеральная лицензия Банка России
            &#8470;&nbsp;354</span>
          <a href="#" class="footer__link">Политика обработки персональных данных</a>
        </div>
      </div>
  
      <button class="footer__theme-toggle" type="button" aria-label="Переключить тему">
        <span class="footer__theme-text">Светлая тема</span>
        <svg class="footer__theme-icon" width="20" height="20" aria-hidden="true">
          <use xlink:href="images/sprite.svg#theme-icon"></use>
        </svg>
      </button>
    </div>
  </footer>

</body>

</html>
